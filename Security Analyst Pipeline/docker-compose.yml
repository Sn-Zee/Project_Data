services:
  # PostgreSQL database container
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: security_analytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Pipeline container: loads data and runs dbt
  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: security_analytics
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  pgdata: